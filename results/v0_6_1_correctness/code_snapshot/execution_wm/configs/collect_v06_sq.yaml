# V0.6 阶段B support/query pilot 采集配置（与 PRE_REGISTRATION.md 一致，冻结）
seed: 42

sim:
  num_envs: 16
  control_dt: 0.02            # 50Hz 原始记录
  decimation: 4
  output_hz: 50               # 原始保存 50Hz；20Hz 另行派生（inputs 因果 / labels 抗混叠）

episode:
  settle_s: 1.0               # query 前的站立稳定段
  min_keep_s: 3.0

conditions:
  normal:       {friction: 1.0, actuator_scale: 1.0}
  friction_mid: {friction: 0.6, actuator_scale: 1.0}
  friction_low: {friction: 0.3, actuator_scale: 1.0}

query_families:
  Q1_straight: [[0.5, [0, 0, 0]], [0.5, [0.4, 0, 0]], [1.0, [0.8, 0, 0]], [0.5, [0.4, 0, 0]], [0.5, [0, 0, 0]]]
  Q2_lateral:  [[0.5, [0, 0, 0]], [1.0, [0, 0.5, 0]], [1.0, [0, -0.5, 0]], [0.5, [0, 0, 0]]]
  Q3_turn:     [[0.5, [0, 0, 0]], [1.0, [0, 0, 0.8]], [1.0, [0, 0, -0.8]], [0.5, [0, 0, 0]]]
  Q4_combo:    [[0.5, [0, 0, 0]], [1.0, [0.6, 0, 0.6]], [1.0, [-0.6, 0, -0.6]], [0.5, [0, 0, 0]]]

n_anchor: 8                   # AQ[i] = 1000 + 17*i
anchor_seed_base: 1000
anchor_seed_stride: 17
reps: 2                       # rep2 段边界 jitter ±0.1s, jitter seed = anchor+5000
n_support_seed: 16            # SP[j] = 5000 + 31*j
support_seed_base: 5000
support_seed_stride: 31
support_segments: 8           # 8 x 1.0s random dwell
support_seg_dur_s: 1.0

split:                        # anchor group 级
  train_anchors: [0, 1, 2, 3, 4]
  val_anchors: [5]
  test_anchors: [6, 7]
held_out_family: Q4_combo     # test-only 命令族

output:
  dataset_dir: /media/hdd1/yuhang/datasets/execution_wm/v0_6_sq
  policy_checkpoint: /home/yuhang/IsaacLab/logs/rsl_rl/unitree_go2_flat/2026-09-20_22-52-26/model_299.pt

smoke:
  families: [Q1_straight, Q3_turn]
  anchors: [0, 1]
